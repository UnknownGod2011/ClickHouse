[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "takekeeper"
version = "0.1.0"
description = "ClickHouse-backed production memory and continuity core for film/media takes"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "TakeKeeper contributors"}]
dependencies = []

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=1,<2"]
gemini = ["google-genai>=1,<2"]
google-auth = ["google-auth>=2,<3"]
production = ["clickhouse-connect>=1,<2", "google-genai>=1,<2", "google-auth>=2,<3"]

[project.scripts]
takekeeper-benchmark = "takekeeper.benchmark_cli:main"
takekeeper-generate-fixture-media = "takekeeper.fixture_media:main"
takekeeper-live-benchmark = "takekeeper.live_candidate_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
