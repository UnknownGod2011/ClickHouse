[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "takekeeper"
version = "0.1.0"
description = "ClickHouse-backed production memory and continuity core for film/media takes"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "TakeKeeper contributors"}]
dependencies = []

[project.optional-dependencies]
clickhouse = ["clickhouse-connect>=1,<2"]
gemini = ["google-genai>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
